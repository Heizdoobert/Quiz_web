name: CI

on:
  push:
    branches: [main, preview]
  pull_request:
    branches: [main, preview]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, Types & Architecture
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Check Secrets (Gitleaks)
        run: gitleaks detect --redact --verbose

      - name: TypeScript Type Check
        run: npm run type-check

      - name: ESLint
        run: npm run lint

      - name: Architecture Boundary Check
        run: npm run check:architecture

  test:
    name: Unit & Integration Tests (Coverage Ratchet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests with Coverage
        run: npm run test:coverage

  contracts:
    name: Smart Contract Tests (Hardhat)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: contracts/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run Hardhat tests
        run: npx hardhat test

  build:
    name: Next.js Production Build
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          BUILDING: 'true'
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_PUBLISHABLE_KEY: test_pub_key
          SUPABASE_SECRET_KEY: test_secret_key
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test_pub_key
          NEXT_PUBLIC_WALLET_CONNECT_PROJECT_ID: test_wallet_connect_id
          NEXT_PUBLIC_QUIZ_TOKEN_ADDRESS: '0x1111111111111111111111111111111111111111'
          NEXT_PUBLIC_QUIZ_BADGE_ADDRESS: '0x2222222222222222222222222222222222222222'
          NEXT_PUBLIC_CONTEST_ESCROW_ADDRESS: '0x3333333333333333333333333333333333333333'
          NEXT_PUBLIC_CHAIN_ID: '84532'
          REWARD_SIGNER_PRIVATE_KEY: '0x9999999999999999999999999999999999999999999999999999999999999999'

  security:
    name: Security & Dependencies Audit
    needs: [quality]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit Production Dependencies
        run: |
          echo "Scanning dependencies against production runtime risk..."
          npm run check:deps || echo "::warning::Transitive dependency advisory detected (documented in CONSTRAINTS.md Exception W1)."
