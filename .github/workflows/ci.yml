name: CI

on:
  push:
    branches: [main, preview]
    paths-ignore:
      - 'mobile/**'
  pull_request:
    branches: [main, preview]
    paths-ignore:
      - 'mobile/**'
  # cd.yml calls this so nothing is published unless these jobs pass on the same commit.
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secrets:
    name: Check Secrets (Gitleaks)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Check Secrets
        run: gitleaks detect --redact --verbose

  typecheck:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Type Check
        run: npm run type-check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

  architecture:
    name: Architecture Boundary Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Architecture Boundary Check
        run: npm run check:architecture

  test:
    name: Unit & Integration Tests (Coverage Ratchet)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Run Tests with Coverage
        run: npm run test:coverage

  build:
    name: Next.js Production Build
    needs: [secrets, typecheck, lint, architecture, test]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Next.js Application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
          BUILDING: 'true'
          SUPABASE_URL: https://test.supabase.co
          SUPABASE_PUBLISHABLE_KEY: test_pub_key
          SUPABASE_SECRET_KEY: test_secret_key
          NEXT_PUBLIC_SUPABASE_URL: https://test.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: test_pub_key

      - name: Bundle size per route
        run: npm run check:bundle

  security:
    name: Security & Dependencies Audit
    needs: [secrets, typecheck, lint, architecture]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Audit Production Dependencies
        run: |
          echo "Scanning dependencies against production runtime risk..."
          npm run check:deps

  # The single check to require in the branch ruleset: it fails when any job above failed,
  # was cancelled or was skipped, so a new job only has to be added to `needs` here.
  ci-gate:
    name: CI gate
    if: always()
    needs: [secrets, typecheck, lint, architecture, test, build, security]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped') }}
        run: exit 1
