name: CD

on:
  push:
    branches:
      - main
      - preview
    paths-ignore:
      - 'mobile/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target environment for manual deployment'
        required: true
        default: 'preview'
        type: choice
        options:
          - preview
          - production
      rollback_sha:
        description: 'Optional commit SHA to deploy / rollback to (leave blank for latest)'
        required: false
        default: ''

concurrency:
  group: cd-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A manual rollback redeploys a commit that already passed CI, so it skips the gate to stay fast.
  ci:
    name: CI
    if: ${{ inputs.rollback_sha == '' }}
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  deploy-container:
    name: Build & Publish Container Image (GHCR)
    needs: ci
    if: ${{ !cancelled() && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.rollback_sha != '' && inputs.rollback_sha || github.sha }}
          fetch-depth: 0

      - name: Determine Deployment Environment & Tags
        id: meta-env
        run: |
          REF="${{ github.ref }}"
          EVENT="${{ github.event_name }}"
          MANUAL_ENV="${{ inputs.target_env }}"
          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          if [ "$EVENT" = "workflow_dispatch" ]; then
            ENV_NAME="$MANUAL_ENV"
          elif [[ "$REF" == refs/heads/main ]]; then
            ENV_NAME="production"
          elif [[ "$REF" == refs/heads/preview ]]; then
            ENV_NAME="preview"
          elif [[ "$REF" == refs/tags/v* ]]; then
            ENV_NAME="production"
          else
            ENV_NAME="preview"
          fi

          echo "environment=$ENV_NAME" >> "$GITHUB_OUTPUT"
          echo "image=$IMAGE_NAME_LOWER" >> "$GITHUB_OUTPUT"

      - name: Docker Meta Configuration
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.meta-env.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ steps.meta-env.outputs.environment == 'production' }}
            type=raw,value=preview,enable=${{ steps.meta-env.outputs.environment == 'preview' }}
            type=ref,event=tag
            type=sha,prefix=${{ steps.meta-env.outputs.environment }}-sha-

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once into the local daemon and scan it before anything is published. The push below
      # reuses the same layers from the build cache. Trivy runs from a digest-pinned image, so no
      # third-party action can change under us; --ignore-unfixed keeps the gate to findings that
      # have a fix.
      - name: Build Image for Scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: quiz-scan:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan Image (Trivy)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.58.1@sha256:ab70a02200597efa04748f210f793936eb647cbcdb0ea69cc30b226d6f5a22c7 \
            image --severity HIGH,CRITICAL --ignore-unfixed --scanners vuln --exit-code 1 quiz-scan:ci

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deployment Summary
        run: |
          echo "### 🚀 Deployment Completed Successfully" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`${{ steps.meta-env.outputs.environment }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Registry**: \`ghcr.io\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Image Tags**:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # Only this job can write to the repository, so the image build above runs with read access.
  release:
    name: Create GitHub Release
    needs: deploy-container
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create GitHub Release on Tag
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
