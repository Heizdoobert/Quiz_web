<!-- Component 1: Header / Timer & Progress -->
<header id="quiz-header" class="quiz-header" aria-label="Quiz Header">
  <div class="header-top">
    <h1 class="brand-title">Quick Quiz</h1>
    <div class="header-actions">
      <button id="btn-theme-toggle" class="btn btn-secondary btn-sm" type="button" aria-label="Toggle theme" title="Toggle dark/light theme">🌙 Dark</button>
      <button id="btn-sound-toggle" class="btn btn-secondary btn-sm" type="button" aria-label="Toggle sound effects" title="Toggle sound effects">🔊 Sound</button>
      <button id="btn-header-guide" class="btn btn-secondary btn-sm" type="button">📖 How to Play</button>
      <button id="btn-timer-settings" class="btn btn-secondary btn-sm" type="button" aria-label="Timer Settings" title="Timer Settings">⏱️ Set Time</button>
    </div>
  </div>

  <!-- Topic & Category Filter Pills -->
  <div id="category-filters" class="category-filters" role="tablist" aria-label="Question Categories">
    <button class="category-pill active" data-category="All" type="button">All Topics</button>
    <div class="category-pill-wrap">
      <button class="category-pill" data-category="HTML" type="button">HTML</button>
      <button class="btn-topic-delete" data-topic="HTML" type="button" title="Delete topic HTML" aria-label="Delete topic HTML">✕</button>
    </div>
    <div class="category-pill-wrap">
      <button class="category-pill" data-category="CSS" type="button">CSS</button>
      <button class="btn-topic-delete" data-topic="CSS" type="button" title="Delete topic CSS" aria-label="Delete topic CSS">✕</button>
    </div>
    <div class="category-pill-wrap">
      <button class="category-pill" data-category="JavaScript" type="button">JavaScript</button>
      <button class="btn-topic-delete" data-topic="JavaScript" type="button" title="Delete topic JavaScript" aria-label="Delete topic JavaScript">✕</button>
    </div>
    <button id="btn-add-topic-pill" class="category-pill add-topic-pill" type="button" title="Add a new topic">➕ Topic</button>
  </div>

  <div class="header-progress">
    <div class="progress-labels">
      <span id="progress-text" class="progress-text">Question 1 of 6</span>
    </div>
    <div class="progress-track" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="6">
      <div id="progress-bar-fill" class="progress-fill" style="width: 16.6%;"></div>
    </div>
  </div>
</header>
